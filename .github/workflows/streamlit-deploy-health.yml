name: Streamlit Deploy Health

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://tronclass-videocap.streamlit.app/
      EXPECTED_DEPLOY_MARKER: build-2026-06-01-01-mac-fallback
      EXPECTED_APP_VERSION: v2026.06.01.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Check deployed Streamlit app in browser
        run: |
          python - <<'PY'
          import os
          import sys
          import time

          from playwright.sync_api import TimeoutError as PlaywrightTimeoutError
          from playwright.sync_api import sync_playwright

          app_url = os.environ["APP_URL"]
          expected_marker = os.environ["EXPECTED_DEPLOY_MARKER"]
          expected_version = os.environ["EXPECTED_APP_VERSION"]

              def read_app_frame_text(page) -> str:
              deadline = time.time() + 30
              while time.time() < deadline:
                app_frame = next((frame for frame in page.frames if "/~/+/" in frame.url), None)
                if app_frame is not None:
                  body_text = app_frame.locator("body").inner_text(timeout=20000)
            if "TronClass" in body_text and expected_version in body_text:
                    return body_text
                page.wait_for_timeout(1000)
              raise SystemExit("App frame did not become readable in time")

          def assert_deployed_page() -> None:
              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch(headless=True)
                  page = browser.new_page()
                  page.goto(app_url, wait_until="domcontentloaded", timeout=30000)
                  page.wait_for_timeout(3000)
                  page.get_by_text("Hosted with Streamlit", exact=False).wait_for(timeout=15000)

                app_text = read_app_frame_text(page)
                print(app_text[:1200])
                    if "TronClass" not in app_text:
                      raise SystemExit("Deployed app did not render the expected app text")
                if expected_version not in app_text:
                  raise SystemExit(f"Expected app version not found: {expected_version}")
                if expected_marker not in app_text:
                  raise SystemExit(f"Expected deploy marker not found: {expected_marker}")

                  browser.close()

          deadline = time.time() + 600
          last_error = None
          while time.time() < deadline:
              try:
                  assert_deployed_page()
                  print("Streamlit deployment health check passed")
                  sys.exit(0)
              except (SystemExit, PlaywrightTimeoutError) as exc:
                  last_error = str(exc)
                  print(f"retrying after probe failure: {last_error}")
                  time.sleep(15)

          raise SystemExit(last_error or "Streamlit deployment health check failed")
          PY