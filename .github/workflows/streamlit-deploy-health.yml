name: Streamlit Deploy Health

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://tronclass-videocap.streamlit.app/
      LEGACY_SHARE_URL: https://share.streamlit.io/jackalcn/TronClassVideoCap/main/main.py
      EXPECTED_DEPLOY_MARKER: build-2026-06-01-01-mac-fallback
      EXPECTED_APP_VERSION: v2026.06.01.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Check deployed Streamlit app in browser
        run: |
          python - <<'PY'
          import os
          import sys
          import time

          from playwright.sync_api import TimeoutError as PlaywrightTimeoutError
          from playwright.sync_api import sync_playwright

          app_url = os.environ["APP_URL"]
          legacy_share_url = os.environ["LEGACY_SHARE_URL"]
          expected_marker = os.environ["EXPECTED_DEPLOY_MARKER"]
          expected_version = os.environ["EXPECTED_APP_VERSION"]

          def assert_in_frame(page, expected_text: str) -> None:
              page.frame_locator("iframe").get_by_text(expected_text, exact=False).first.wait_for(timeout=15000)

          def assert_deployed_page() -> None:
              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch(headless=True)
                  page = browser.new_page()
                  page.goto(app_url, wait_until="domcontentloaded", timeout=30000)
                  page.wait_for_timeout(3000)
                  page.get_by_text("Hosted with Streamlit", exact=False).wait_for(timeout=15000)

                  title = page.title()
                  print(f"page title={title}")
                  if "TronClass 影片下載平台" not in title:
                      raise SystemExit(f"Unexpected page title: {title}")

                  assert_in_frame(page, "TronClass 影片下載平台")
                  assert_in_frame(page, f"版本 {expected_version}")
                  assert_in_frame(page, f"Deploy marker: {expected_marker}")

                  legacy_page = browser.new_page()
                  legacy_page.goto(legacy_share_url, wait_until="domcontentloaded", timeout=30000)
                  legacy_page.wait_for_timeout(2000)
                  legacy_title = legacy_page.title()
                  print(f"legacy title={legacy_title}")
                  if "TronClass 影片下載平台" not in legacy_title and "Streamlit" not in legacy_title:
                      raise SystemExit(f"Legacy entrypoint did not look correct: {legacy_title}")

                  browser.close()

          deadline = time.time() + 600
          last_error = None
          while time.time() < deadline:
              try:
                  assert_deployed_page()
                  print("Streamlit deployment health check passed")
                  sys.exit(0)
              except (SystemExit, PlaywrightTimeoutError) as exc:
                  last_error = str(exc)
                  print(f"retrying after probe failure: {last_error}")
                  time.sleep(15)

          raise SystemExit(last_error or "Streamlit deployment health check failed")
          PY